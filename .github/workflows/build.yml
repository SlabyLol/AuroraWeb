name: Build AuroraWeb

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout AuroraOS (SDK)
        uses: actions/checkout@v4
        with:
          repository: TeamAuroraOS/AuroraOS
          path: AuroraOS
          fetch-depth: 1

      - name: Install Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3

      - name: Verify toolchain
        run: |
          export PATH="/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:$PATH"
          which arm-none-eabi-gcc
          arm-none-eabi-gcc --version

      - name: Build with aurcc.py
        run: |
          export PATH="/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:$PATH"
          python3 AuroraOS/sdk/aurcc.py build src/main.c \
            -o AuroraWeb.bin \
            --icon icon.icon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraWeb-bin
          path: AuroraWeb.bin

      - name: Continuous release (latest)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AuroraWeb (latest)
          body: |
            Automatic build from `${{ github.sha }}`

            Copy `AuroraWeb.bin` to `SD:/Aurora/Apps/C/` and launch from the Aurora Home Menu.
          files: AuroraWeb.bin
          draft: false
          prerelease: true
          make_latest: true

      - name: Versioned release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: AuroraWeb ${{ github.ref_name }}
          body: |
            Release **${{ github.ref_name }}**

            Copy `AuroraWeb.bin` to `SD:/Aurora/Apps/C/` and launch from the Aurora Home Menu.
          files: AuroraWeb.bin
          draft: false
          prerelease: false
          make_latest: true

name: Build AuroraWeb

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout AuroraOS (SDK)
        uses: actions/checkout@v4
        with:
          repository: TeamAuroraOS/AuroraOS
          path: AuroraOS
          fetch-depth: 1

      - name: Install devkitARM
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils
          wget -q https://github.com/devkitPro/pacman/releases/download/v1.0.2/devkitpro-pacman.amd64.deb
          sudo dpkg -i devkitpro-pacman.amd64.deb || true
          sudo apt-get install -f -y
          sudo dkp-pacman -Sy --noconfirm
          sudo dkp-pacman -S --noconfirm 3ds-dev
          echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build with aurcc.py
        run: |
          python AuroraOS/sdk/aurcc.py build src/main.c \
            -o AuroraWeb.bin \
            --icon icon.icon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraWeb-bin
          path: AuroraWeb.bin
